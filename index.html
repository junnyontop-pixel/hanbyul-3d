<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="src/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hanbyul-3d</title>
  </head>
  <body>
    <div id="app">
      <div id="canvas"></div>

      <div id="chat-ui">
        <div id="bubble-container">
          <div id="bubble">불러오는 중...</div>
          <button id="reset-btn" title="대화 초기화">↺</button>
        </div>
        <form id="chat-form">
          <input type="text" id="user-input" placeholder="말 걸기..." autocomplete="off" />
          <button type="submit" id="send-btn">전송</button>
        </form>
      </div>
    </div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
